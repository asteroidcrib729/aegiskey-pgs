name: Release Windows Installers (EXE & MSIX)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (e.g. 2.0.1); defaults to pyproject.toml version"
        required: false
        default: ""
      prerelease:
        description: "Mark GitHub Release as a prerelease (manual dispatch only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows EXE + MSIX Installers
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python 3.14.7 & sync locked dependencies
        run: |
          uv python install
          uv lock --check
          uv sync --locked --all-groups

      - name: Run full pre-release verification suite
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pyrefly check
          uv run pytest -v

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      - name: Resolve release version
        id: meta
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}".Trim()
          if (-not $ver -and "${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          }
          if (-not $ver) {
            $ver = (uv run python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text('utf-8'))['project']['version'])").Trim()
          }
          Write-Output "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Output "Resolved release version: $ver"

      - name: Build Portable EXE, Setup EXE & Signed MSIX + Smoke Test
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          uv run python -m installers.windows.build_windows `
            --version "${{ steps.meta.outputs.version }}" `
            --format all `
            --require-setup `
            --require-msix `
            --smoke-test

      - name: Build Python Wheel & Sdist
        run: uv build --out-dir dist/python

      - name: Verify checksums & MSIX signature
        shell: pwsh
        run: |
          Get-Content dist\windows\SHA256SUMS.txt
          $msix = Get-ChildItem dist\windows\*.msix | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $msix.FullName
          Write-Output "MSIX signature status: $($sig.Status) ($($sig.SignerCertificate.Subject))"
          if ($sig.Status -eq 'NotSigned') {
            throw "MSIX package is unsigned."
          }

      - name: Upload workflow release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AegisKey-${{ steps.meta.outputs.version }}-release
          if-no-files-found: error
          path: |
            dist/windows/*.exe
            dist/windows/*.msix
            dist/windows/*.cer
            dist/windows/SHA256SUMS.txt
            dist/python/*.whl
            dist/python/*.tar.gz

      - name: Create or update GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: "AegisKey v${{ steps.meta.outputs.version }}"
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease == true || contains(steps.meta.outputs.version, '-') }}
          files: |
            dist/windows/*.exe
            dist/windows/*.msix
            dist/windows/*.cer
            dist/windows/SHA256SUMS.txt
            dist/python/*.whl
            dist/python/*.tar.gz

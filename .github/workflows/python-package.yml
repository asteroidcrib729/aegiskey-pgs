name: Python Package Build

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build & Verify Wheel / Sdist
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python 3.14.7
        run: uv python install

      - name: Build sdist & wheel
        run: uv build --out-dir dist/python

      - name: Verify packaged dictionary & CLI entry point
        run: |
          uv run python -c "import zipfile, pathlib; whl = next(pathlib.Path('dist/python').glob('*.whl')); names = zipfile.ZipFile(whl).namelist(); assert any('wordlist.txt' in n for n in names), names; print('Verified wordlist.txt in', whl.name)"
          uv run --no-project --with dist/python/*.whl password-generator --version

      - name: Upload wheel & sdist
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          if-no-files-found: error
          path: dist/python/*

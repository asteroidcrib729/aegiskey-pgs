name: Bug Report
description: Report a UI glitch, generation bug, clipboard issue, or installer problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping make AegisKey more reliable. Never paste real passwords or private keys into issues.
  - type: input
    id: version
    attributes:
      label: App Version & Install Method
      description: e.g. 2.0.0 Portable EXE, Setup EXE, MSIX, or `uv run`
      placeholder: "2.0.0 Setup EXE"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System & Display Scaling
      description: e.g. Windows 11 24H2, 2560x1440 at 150% or 200% DPI scaling
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact actions leading to the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
    validations:
      required: true
